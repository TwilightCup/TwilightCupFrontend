worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log off; # Scene URLs and WebSocket paths may carry credentials.
    server {
        listen 8080;
        root /srv/site;
        index index.html;
        absolute_redirect off;
        location = /twilightcup { return 308 /twilightcup/$is_args$args; }
        # Never serve SPA HTML for missing files or requests owned by ingress.
        location ~ ^/(twilightcup/)?(api|ws|assets)(/|$) { return 404; }
        location ~ ^/(twilightcup/)?(static|LevelBGs|vendor|tools)/ { try_files $uri =404; }
        location ~ /[^/]+\.[^/]+$ { try_files $uri =404; }
        location /twilightcup/ { try_files $uri $uri/ /twilightcup/index.html; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
