<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // 语言早设（与 index.html 同逻辑），首屏前据 localStorage.twc_locale 设 <html lang>。
      (function () {
        var supported = ["zh-CN", "en-US"];
        var loc = localStorage.getItem("twc_locale");
        if (supported.indexOf(loc) === -1) loc = "zh-CN";
        document.documentElement.lang = loc;
      })();
    </script>
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>叠加层 · 黄昏杯</title>
    <style>
      /* 叠加层独立：透明背景（OBS 浏览器源叠加在游戏画面上），不读主应用主题 */
      html,
      body,
      #overlay-app {
        margin: 0;
        height: 100%;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="overlay-app"></div>
    <script type="module" src="/src/overlay/main.ts"></script>
  </body>
</html>
